    <!-- ==================================================

    <script src="productos.js"></script>

<script>

    /* =========================
       OBTENER CATEGORÍA DE LA URL
    ========================= */

    const parametros = new URLSearchParams(
        window.location.search
    );

        let categoria =
            parametros.get("categoria");


        if (!productos[categoria]) {
            categoria = "baby";
        }


        /* ================================================
           VARIABLES
        ================================================= */

        const listaProductos =
            productos[categoria];

        let productoActual = 0;


        const track =
            document.getElementById(
                "carousel-track"
            );

        const dots =
            document.getElementById(
                "dots"
            );


        /* ================================================
           TÍTULO
        ================================================= */

        document.getElementById(
            "category-title"
        ).textContent =
            nombresCategorias[categoria];


        document.getElementById(
            "category-description"
        ).textContent =
            descripciones[categoria];


        /* ================================================
           MARCAR CATEGORÍA ACTIVA
        ================================================= */

        document.querySelectorAll(
            ".category-buttons a"
        ).forEach(boton => {

            if (
                boton.dataset.category === categoria
            ) {

                boton.classList.add("active");

            }

        });


        /* ================================================
           CREAR TARJETAS
        ================================================= */

        function crearTarjetas() {

            track.innerHTML = "";

            dots.innerHTML = "";


            listaProductos.forEach(
                (producto, index) => {


                    const tarjeta =
                        document.createElement(
                            "article"
                        );


                    tarjeta.className =
                        "slide";


                    tarjeta.innerHTML = `

    <div class="slide-image">

        <img
            src="${producto.imagen}"
            alt="${producto.nombre}">

    </div>

    <div class="slide-info">

        <span class="slide-reference">
            ${producto.referencia}
        </span>

        <h3>
            ${producto.nombre}
        </h3>

    </div>

`;


     tarjeta.addEventListener(
    "click",
    () => {

        if (index === productoActual) {

            abrirZoom();

        } else {

            productoActual = index;

            actualizarCarrusel();

        }

    }
);


                    track.appendChild(
                        tarjeta
                    );


                    /* DOT */

                    const punto =
                        document.createElement(
                            "button"
                        );


                    punto.className =
                        "dot";


                    punto.addEventListener(
                        "click",
                        () => {

                            productoActual = index;

                            actualizarCarrusel();

                        }
                    );


                    dots.appendChild(
                        punto
                    );

                }
            );


            actualizarCarrusel();

        }


        /* ================================================
           ACTUALIZAR CARRUSEL
        ================================================= */

        function actualizarCarrusel() {

            const tarjetas =
                document.querySelectorAll(
                    ".slide"
                );


            const total =
                tarjetas.length;


            tarjetas.forEach(
                (tarjeta, index) => {


                    tarjeta.classList.remove(
                        "active",
                        "previous",
                        "next"
                    );


                    if (
                        index === productoActual
                    ) {

                        tarjeta.classList.add(
                            "active"
                        );

                    }


                    else if (
                        index ===
                        (
                            productoActual -
                            1 +
                            total
                        ) % total
                    ) {

                        tarjeta.classList.add(
                            "previous"
                        );

                    }


                    else if (
                        index ===
                        (
                            productoActual +
                            1
                        ) % total
                    ) {

                        tarjeta.classList.add(
                            "next"
                        );

                    }

                }
            );


            /* DOTS */

            document.querySelectorAll(
                ".dot"
            ).forEach(
                (punto, index) => {

                    punto.classList.toggle(
                        "active",
                        index === productoActual
                    );

                }
            );


            /* INFORMACIÓN */

            const producto =
                listaProductos[
                    productoActual
                ];


            document.getElementById(
                "selected-reference"
            ).textContent =
                producto.referencia;


            document.getElementById(
                "selected-name"
            ).textContent =
                producto.nombre;


            document.getElementById(
                "selected-description"
            ).textContent =
                producto.descripcion;


            document.getElementById(
                "selected-price"
            ).textContent =
                producto.precio;


            /* WHATSAPP */

            const mensaje =
                `Hola, estoy interesado en ${producto.nombre} (${producto.referencia}).`;


            document.getElementById(
                "consult-button"
            ).href =
                "https://wa.me/57XXXXXXXXXX?text=" +
                encodeURIComponent(
                    mensaje
                );

        }


        /* ================================================
           BOTÓN ANTERIOR
        ================================================= */

        document.getElementById(
            "previous-button"
        ).addEventListener(
            "click",
            () => {

                productoActual--;

                if (
                    productoActual < 0
                ) {

                    productoActual =
                        listaProductos.length - 1;

                }

                actualizarCarrusel();

            }
        );


        /* ================================================
           BOTÓN SIGUIENTE
        ================================================= */

        document.getElementById(
            "next-button"
        ).addEventListener(
            "click",
            () => {

                productoActual++;

                if (
                    productoActual >=
                    listaProductos.length
                ) {

                    productoActual = 0;

                }

                actualizarCarrusel();

            }
        );


        /* ================================================
           INICIAR
        ================================================= */

        crearTarjetas();

        /* ================================================
   ZOOM DE PRODUCTO
================================================ */

/* ================================================
   ZOOM AVANZADO DE PRODUCTO
================================================ */

const zoomModal =
    document.getElementById("zoom-modal");

const zoomImage =
    document.getElementById("zoom-image");

    const zoomPrev =
    document.getElementById("zoom-prev");

const zoomNext =
    document.getElementById("zoom-next");

const zoomClose =
    document.getElementById("zoom-close");

const zoomIn =
    document.getElementById("zoom-in");

const zoomOut =
    document.getElementById("zoom-out");


/* ================================================
   VARIABLES DEL ZOOM
================================================ */

let zoomLevel = 1;

let positionX = 0;
let positionY = 0;

let isDragging = false;

let startX = 0;
let startY = 0;


/* ================================================
   ACTUALIZAR IMAGEN
================================================ */

function actualizarZoom() {

    zoomImage.style.transform =
        `translate(${positionX}px, ${positionY}px) scale(${zoomLevel})`;

}


/* ================================================
   REINICIAR ZOOM
================================================ */

function reiniciarZoom() {

    zoomLevel = 1;

    positionX = 0;

    positionY = 0;

    actualizarZoom();

}


/* ================================================
   ABRIR ZOOM
================================================ */

function abrirZoom() {

    const producto =
        listaProductos[productoActual];


    zoomImage.src =
        producto.imagen;


    zoomImage.alt =
        producto.nombre;


    reiniciarZoom();


    zoomModal.classList.add(
        "active"
    );

}

function productoAnterior() {
    productoActual--;

    if (productoActual < 0) {
        productoActual = listaProductos.length - 1;
    }

    abrirZoom();
}

function productoSiguiente() {
    productoActual++;

    if (productoActual >= listaProductos.length) {
        productoActual = 0;
    }

    abrirZoom();
}



/* ================================================
   CERRAR ZOOM
================================================ */

function cerrarZoom() {

    zoomModal.classList.remove(
        "active"
    );

}


/* ================================================
   AUMENTAR ZOOM
================================================ */

function aumentarZoom(
    cantidad = 0.25
) {

    zoomLevel += cantidad;


    if (zoomLevel > 4) {

        zoomLevel = 4;

    }


    actualizarZoom();

}


/* ================================================
   REDUCIR ZOOM
================================================ */

function reducirZoom(
    cantidad = 0.25
) {

    zoomLevel -= cantidad;


    if (zoomLevel < 1) {

        zoomLevel = 1;

        positionX = 0;

        positionY = 0;

    }


    actualizarZoom();

}


/* ================================================
   BOTÓN +
================================================ */

zoomIn.addEventListener(
    "click",
    () => {

        aumentarZoom();

    }
);


/* ================================================
   BOTÓN -
================================================ */

zoomOut.addEventListener(
    "click",
    () => {

        reducirZoom();

    }
);



/* ================================================
   RUEDA DEL MOUSE
================================================ */

zoomImage.addEventListener(
    "wheel",
    (evento) => {

        evento.preventDefault();


        if (
            evento.deltaY < 0
        ) {

            aumentarZoom(0.15);

        } else {

            reducirZoom(0.15);

        }

    },
    {
        passive: false
    }
);


/* ================================================
   DOBLE CLIC
================================================ */

zoomImage.addEventListener(
    "dblclick",
    (evento) => {

        evento.preventDefault();


        if (
            zoomLevel === 1
        ) {

            zoomLevel = 2;

        } else {

            zoomLevel = 1;

            positionX = 0;

            positionY = 0;

        }


        actualizarZoom();

    }
);


/* ================================================
   ARRASTRAR CON MOUSE
================================================ */

zoomImage.addEventListener(
    "mousedown",
    (evento) => {

        if (
            zoomLevel <= 1
        ) {

            return;

        }


        isDragging = true;


        startX =
            evento.clientX -
            positionX;


        startY =
            evento.clientY -
            positionY;


        zoomImage.style.cursor =
            "grabbing";

    }
);


document.addEventListener(
    "mousemove",
    (evento) => {

        if (
            !isDragging
        ) {

            return;

        }


        positionX =
            evento.clientX -
            startX;


        positionY =
            evento.clientY -
            startY;


        actualizarZoom();

    }
);


document.addEventListener(
    "mouseup",
    () => {

        isDragging = false;


        zoomImage.style.cursor =
            zoomLevel > 1
                ? "grab"
                : "default";

    }
);


/* ================================================
   VARIABLES PARA TOUCH
================================================ */

let initialDistance = 0;

let initialZoom = 1;

let touchStartX = 0;

let touchStartY = 0;


/* ================================================
   CALCULAR DISTANCIA ENTRE DOS DEDOS
================================================ */

function obtenerDistancia(
    touch1,
    touch2
) {

    const diferenciaX =
        touch1.clientX -
        touch2.clientX;


    const diferenciaY =
        touch1.clientY -
        touch2.clientY;


    return Math.sqrt(
        diferenciaX * diferenciaX +
        diferenciaY * diferenciaY
    );

}


/* ================================================
   TOUCH — INICIO
================================================ */

zoomImage.addEventListener(
    "touchstart",
    (evento) => {

        /* DOS DEDOS */

        if (
            evento.touches.length === 2
        ) {

            initialDistance =
                obtenerDistancia(
                    evento.touches[0],
                    evento.touches[1]
                );


            initialZoom =
                zoomLevel;

        }


        /* UN DEDO */

        else if (
            evento.touches.length === 1 &&
            zoomLevel > 1
        ) {

            touchStartX =
                evento.touches[0].clientX -
                positionX;


            touchStartY =
                evento.touches[0].clientY -
                positionY;

        }

    },
    {
        passive: false
    }
);


/* ================================================
   TOUCH — MOVIMIENTO
================================================ */

zoomImage.addEventListener(
    "touchmove",
    (evento) => {

        evento.preventDefault();


        /* =========================
           DOS DEDOS = PINCH
        ========================== */

        if (
            evento.touches.length === 2
        ) {

            const distanciaActual =
                obtenerDistancia(
                    evento.touches[0],
                    evento.touches[1]
                );


            const factor =
                distanciaActual /
                initialDistance;


            zoomLevel =
                initialZoom * factor;


            if (
                zoomLevel < 1
            ) {

                zoomLevel = 1;

            }


            if (
                zoomLevel > 4
            ) {

                zoomLevel = 4;

            }


            actualizarZoom();

        }


        /* =========================
           UN DEDO = ARRASTRAR
        ========================== */

        else if (
            evento.touches.length === 1 &&
            zoomLevel > 1
        ) {

            positionX =
                evento.touches[0].clientX -
                touchStartX;


            positionY =
                evento.touches[0].clientY -
                touchStartY;


            actualizarZoom();

        }

    },
    {
        passive: false
    }
);


/* ================================================
   CERRAR CON X
================================================ */

zoomClose.addEventListener(
    "click",
    cerrarZoom
);


zoomPrev.addEventListener(
    "click",
    productoAnterior
);

zoomNext.addEventListener(
    "click",
    productoSiguiente
);


/* ================================================
   CERRAR HACIENDO CLIC EN EL FONDO
================================================ */

zoomModal.addEventListener(
    "click",
    (evento) => {

        if (
            evento.target === zoomModal
        ) {

            cerrarZoom();

        }

    }
);


/* ================================================
   ESC PARA CERRAR
================================================ */

document.addEventListener(
    "keydown",
    (evento) => {

        if (
            evento.key === "Escape"
        ) {

            cerrarZoom();

        }

    }
);


    </script>

<script>
(function () {

    const categoriaActual = new URLSearchParams(window.location.search).get("categoria");

    const colores = {
    baby: "#F3B6CF",
    nino: "#A9DDE8",
    juvenil: "#C5B5E5",
    dama: "#F3B6D0",
    hombre: "#B7C5E3",
    otros: "#D6D6D6"
};

    const color = colores[categoriaActual];

    if (color) {

        // Cambia el fondo general
        document.body.style.backgroundColor = color;

        // Cambia específicamente el MAIN de productos
        const catalogo = document.querySelector("main.catalog-page");

        if (catalogo) {
            catalogo.style.backgroundColor = color;
        }

    }

})();
</script>
